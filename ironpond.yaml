  LogBucketCC3B17E8:
    Type: AWS::S3::Bucket
    Properties:
      AccessControl: BucketOwnerFullControl
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - PUT
              - GET
            AllowedOrigins:
              - ironpond.net
      LifecycleConfiguration:
        Rules:
          - ExpirationInDays: 3
            Prefix: .csv
            Status: Enabled
          - ExpirationInDays: 3
            Prefix: .gz
            Status: Enabled
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Metadata:
      aws:cdk:path: IronpondStack/LogBucket/Resource
