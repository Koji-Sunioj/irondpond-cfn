Parameters:
  DataBricksHost:
    Description: data bricks host url
    Type: String
  DataBricksToken:
    Description: data bricks token for changes
    Type: String
  FunctionVersion:
    Description: version of function zip in s3
    Type: String
  FunctionBucket:
    Description: bucket name of where functions zip lives
    Type: String

Resources:
  LogBucketCC3B17E8:
    Type: AWS::S3::Bucket
    Properties:
      AccessControl: BucketOwnerFullControl
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - PUT
              - GET
            AllowedOrigins:
              - ironpond.net
      LifecycleConfiguration:
        Rules:
          - ExpirationInDays: 3
            Prefix: .csv
            Status: Enabled
          - ExpirationInDays: 3
            Prefix: .gz
            Status: Enabled
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Metadata:
      aws:cdk:path: IronpondStack/LogBucket/Resource
  IronPondCustomDomainCertificate160317C0:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: ironpond.net
      DomainValidationOptions:
        - DomainName: ironpond.net
          HostedZoneId: Z06380132RLBS430KZ93O
      Tags:
        - Key: Name
          Value: IronpondStack/IronPond/CustomDomainCertificate
      ValidationMethod: DNS
    Metadata:
      aws:cdk:path: IronpondStack/IronPond/CustomDomainCertificate/Resource
  IronPondLandingBucket32063821:
    Type: AWS::S3::Bucket
    Properties:
      AccessControl: Private
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Metadata:
      aws:cdk:path: IronpondStack/IronPond/LandingBucket/Resource
  IronPondLandingBucketPolicyE3813E0D:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: IronPondLandingBucket32063821
      PolicyDocument:
        Statement:
          - Action:
              - s3:GetBucket*
              - s3:GetObject*
              - s3:List*
            Effect: Allow
            Principal:
              CanonicalUser:
                Fn::GetAtt:
                  - IronPondOriginAccessIdentityDDBFE084
                  - S3CanonicalUserId
            Resource:
              - Fn::GetAtt:
                  - IronPondLandingBucket32063821
                  - Arn
              - Fn::Join:
                  - ""
                  - - Fn::GetAtt:
                        - IronPondLandingBucket32063821
                        - Arn
                    - /*
          - Action: s3:GetObject
            Effect: Allow
            Principal:
              CanonicalUser:
                Fn::GetAtt:
                  - IronPondOriginAccessIdentityDDBFE084
                  - S3CanonicalUserId
            Resource:
              Fn::Join:
                - ""
                - - Fn::GetAtt:
                      - IronPondLandingBucket32063821
                      - Arn
                  - /*
        Version: "2012-10-17"
    Metadata:
      aws:cdk:path: IronpondStack/IronPond/LandingBucket/Policy/Resource
  IronPondOriginAccessIdentityDDBFE084:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: Allows CloudFront to reach the bucket
    Metadata:
      aws:cdk:path: IronpondStack/IronPond/OriginAccessIdentity/Resource
  IronPondLandingDistributionA69862F3:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases:
          - ironpond.net
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        DefaultCacheBehavior:
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
          TargetOriginId: IronpondStackIronPondLandingDistributionOrigin14A565CA0
          ViewerProtocolPolicy: allow-all
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2
        IPV6Enabled: true
        Logging:
          Bucket:
            Fn::GetAtt:
              - LogBucketCC3B17E8
              - RegionalDomainName
        Origins:
          - DomainName:
              Fn::GetAtt:
                - IronPondLandingBucket32063821
                - RegionalDomainName
            Id: IronpondStackIronPondLandingDistributionOrigin14A565CA0
            S3OriginConfig:
              OriginAccessIdentity:
                Fn::Join:
                  - ""
                  - - origin-access-identity/cloudfront/
                    - Ref: IronPondOriginAccessIdentityDDBFE084
        ViewerCertificate:
          AcmCertificateArn:
            Ref: IronPondCustomDomainCertificate160317C0
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only
    Metadata:
      aws:cdk:path: IronpondStack/IronPond/LandingDistribution/Resource
  IronPondwebsiterecord56FEA0F7:
    Type: AWS::Route53::RecordSet
    Properties:
      Name: ironpond.net.
      Type: A
      AliasTarget:
        DNSName:
          Fn::GetAtt:
            - IronPondLandingDistributionA69862F3
            - DomainName
        HostedZoneId:
          Fn::FindInMap:
            - AWSCloudFrontPartitionHostedZoneIdMap
            - Ref: AWS::Partition
            - zoneId
      HostedZoneId: Z06380132RLBS430KZ93O
    Metadata:
      aws:cdk:path: IronpondStack/IronPond/website-record/Resource
  IronPondLogsDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: ironpond
  IronPondLogsTable:      
    DependsOn:
      - IronPondLogsDatabase
    Type: AWS::Glue::Table
    Properties: 
      CatalogId: !Ref AWS::AccountId
      DatabaseName: ironpond
      TableInput:
        Name: cloudfront_logs
        TableType: EXTERNAL_TABLE
        StorageDescriptor:
          Columns:
            - Name: date
              Type: date
            - Name: time
              Type: string
            - Name: location
              Type: string
            - Name: bytes
              Type: bigint
            - Name: request_ip
              Type: string
            - Name: method
              Type: string
            - Name: host
              Type: string
            - Name: uri
              Type: string
            - Name: status
              Type: int
            - Name: referrer
              Type: string
            - Name: user_agent
              Type: string
            - Name: query_string
              Type: string
            - Name: cookie 
              Type: string
            - Name: result_type
              Type: string
            - Name: request_id
              Type: string
            - Name: host_header
              Type: string
            - Name: request_protocol
              Type: string 
            - Name: request_bytes
              Type: bigint 
            - Name: time_taken
              Type: float 
            - Name: xforwarded_for
              Type: string
          Location: !Sub "s3://${LogBucketCC3B17E8}/"
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            Parameters:
              field.delim: "\t"
              skip.header.line.count: "2"
            SerializationLibrary: org.apache.hadoop.hive.serde2.lazy.LazySimpleSerDe
  AthenaPreviousDayQuery:
    Type: AWS::Athena::NamedQuery
    Properties:
      Database: ironpond
      QueryString: >
                  select
                  date,
                  time,
                  location,
                  request_ip,
                  referrer,
                  method,
                  host,
                  uri,
                  status,
                  user_agent,
                  referrer
                  from cloudfront_logs
                  where date =  current_date - interval '1' day;
  TriggerAthenaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service:
                - "lambda.amazonaws.com"
            Action:
              - "sts:AssumeRole"
      Policies:
        - PolicyName: trigger_athena_query
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action: "athena:GetNamedQuery"
                #Resource: "*"
                Resource: !Sub "arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:*/*"
              - Effect: "Allow"
                Action: "athena:StartQueryExecution"
                Resource: !Sub "arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:*/*"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"  
  TriggerAthenaLambda:
    Type: AWS::Lambda::Function
    Properties:
      Handler: trigger_athena.handler
      Role: !GetAtt TriggerAthenaRole.Arn
      Runtime: python3.14
      Code:
        S3Bucket: !Ref FunctionBucket
        S3Key: functions/ironpond_functions.zip
        S3ObjectVersion: !Ref FunctionVersion
      Environment:
        Variables:
          ATHENA_QUERY_ID: !GetAtt AthenaPreviousDayQuery.NamedQueryId
          LOGS_BUCKET: !Ref LogBucketCC3B17E8
Mappings:
  AWSCloudFrontPartitionHostedZoneIdMap:
    aws:
      zoneId: Z2FDTNDATAQYW2
    aws-cn:
      zoneId: Z3RFFRIM2A3IF5

